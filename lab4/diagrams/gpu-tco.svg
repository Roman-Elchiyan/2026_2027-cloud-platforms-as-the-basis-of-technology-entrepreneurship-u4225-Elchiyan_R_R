<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Совокупные приведённые затраты за 15 месяцев при постоянной нагрузке</title>
<desc id="desc">Сравниваются затраты на API и на покупку, ввод, эксплуатацию сервера с двумя L4 и резервный API. Покупка приходится на нулевой месяц. Кривые пересекаются примерно на 897 тысячах вызовов в месяц.</desc>
